name: KnowledgeHub — import remaining free credits
on:
  workflow_dispatch:
    inputs:
      max_videos:
        description: Maximum new transcript requests (up to 88)
        required: true
        default: '88'
permissions:
  contents: read
concurrency:
  group: knowledgehub-transcript-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Import missing Russian captions and audit quality
        env:
          TRANSCRIPTYT_API_KEY: ${{ secrets.TRANSCRIPTYT_API_KEY }}
          KNOWLEDGEHUB_URL: ${{ secrets.KNOWLEDGEHUB_URL }}
          ADMIN_IMPORT_TOKEN: ${{ secrets.ADMIN_IMPORT_TOKEN }}
          MAX_VIDEOS: ${{ inputs.max_videos }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.parse,urllib.error,statistics
          from pathlib import Path
          Path("results").mkdir(exist_ok=True)
          key=os.environ.get("TRANSCRIPTYT_API_KEY","")
          site=os.environ.get("KNOWLEDGEHUB_URL","").rstrip("/")
          token=os.environ.get("ADMIN_IMPORT_TOKEN","")
          if not all([key,site,token]) or not site.startswith("https://"): raise SystemExit("Missing or invalid GitHub Secrets")
          maximum=min(88,max(1,int(os.environ.get("MAX_VIDEOS","88"))))
          def call(url,headers=None,body=None):
              req=urllib.request.Request(url,headers=headers or {},data=body,method="POST" if body is not None else "GET")
              try:
                  with urllib.request.urlopen(req,timeout=65) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: result=json.loads(e.read())
                  except Exception: result={"error":"HTTP "+str(e.code)}
                  return e.code,result
          auth={"Authorization":"Bearer "+token}
          code,usage=call("https://transcript-yt.com/v1/usage",{"Authorization":"Bearer "+key})
          if code!=200: raise SystemExit("Could not check credits; aborting before requests: HTTP "+str(code))
          available=usage.get("credits_remaining")
          if not isinstance(available,(int,float)): raise SystemExit("Credit balance unknown; aborting")
          maximum=min(maximum,int(available))
          print("Credits before:",available,"maximum new requests:",maximum)
          if maximum<1: raise SystemExit("No credits remaining")
          code,data=call(site+"/api/admin/videos",auth)
          if code!=200: raise SystemExit("Video list failed: "+str(code))
          videos=data.get("videos",[])
          code,data=call(site+"/api/admin/transcript-ids",auth)
          if code!=200: raise SystemExit("Existing transcript check failed: "+str(code))
          existing=set(data.get("video_ids",[]))
          candidates=[v for v in videos if v.get("id") not in existing]
          print("Total catalog:",len(videos),"already saved:",len(existing),"candidates:",len(candidates))
          results=[]
          def checkpoint():
              Path("results/summary.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          last_api_call=0.0
          for v in candidates[:maximum]:
              vid=v["id"]
              params=urllib.parse.urlencode({"url":vid,"language":"ru","format":"json","mode":"captions"})
              wait=max(0,8.0-(time.monotonic()-last_api_call))
              if wait: time.sleep(wait)
              code,data=call("https://transcript-yt.com/v1/transcript?"+params,{"Authorization":"Bearer "+key,"Accept":"application/json"})
              last_api_call=time.monotonic()
              if code==429:
                  print("Rate limited: cooling down for 75 seconds before one retry",flush=True)
                  time.sleep(75)
                  code,data=call("https://transcript-yt.com/v1/transcript?"+params,{"Authorization":"Bearer "+key,"Accept":"application/json"})
                  last_api_call=time.monotonic()
              item={"video_id":vid,"title":v.get("title","")[:120],"http":code}
              if code!=200 or not isinstance(data,dict):
                  item["status"]="transcript_api_error"
                  item["error"]=str(data.get("error",""))[:150] if isinstance(data,dict) else "invalid_response"
                  print("API error",vid,"HTTP",code,"detail",item["error"],flush=True)
                  results.append(item)
                  checkpoint()
                  if code in (401,402,403,429) or code>=500 or sum(x["status"]=="transcript_api_error" for x in results)>=3:
                      print("STOP: API errors; do not continue spending requests",flush=True)
                      break
                  time.sleep(2)
                  continue
              else:
                  segments=data.get("segments") or []
                  transcript="\n".join(str(s.get("text","")) for s in segments if isinstance(s,dict))
                  if not transcript.strip(): transcript=str(data.get("text") or "")
                  item.update(language=data.get("language"),source=data.get("source"),characters=len(transcript),segments=len(segments))
                  starts=[]
                  for s in segments:
                      if isinstance(s,dict):
                          for field in ("start","start_time","offset"):
                              try:
                                  if field in s: starts.append(float(s[field]));break
                              except (ValueError,TypeError):pass
                  if starts:item["last_segment_start"]=max(starts)
                  item["quality_flag"]="review_short_or_sparse" if len(transcript)<2000 or len(segments)<40 else "needs_duration_comparison"
                  if data.get("language")!="ru" or len(transcript)<50:
                      item["status"]="invalid_response"
                  else:
                      payload={"video_id":vid,"transcript":transcript,"source_note":"TranscriptYT API, Russian YouTube captions; automated import, not verified; usage rights require review"}
                      code2,res=call(site+"/api/admin/transcripts",{"Authorization":"Bearer "+token,"Content-Type":"application/json"},json.dumps(payload,ensure_ascii=False).encode())
                      item["save_http"]=code2
                      item["status"]="saved" if code2==200 else "save_error"
              results.append(item)
              checkpoint()
              print(vid,item["status"],"characters",item.get("characters",0),"quality",item.get("quality_flag","n/a"),flush=True)
              time.sleep(1)
          code,usage=call("https://transcript-yt.com/v1/usage",{"Authorization":"Bearer "+key})
          print("Credits after:",usage.get("credits_remaining","unknown") if code==200 else "unknown")
          print("SUMMARY",json.dumps({"saved":sum(x["status"]=="saved" for x in results),"failed":sum(x["status"]!="saved" for x in results),"flagged":sum(x.get("quality_flag")=="review_short_or_sparse" for x in results)},ensure_ascii=False))
          PY
      - name: Upload audit (no transcript text or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledgehub-import-audit
          path: results/summary.json
          if-no-files-found: warn
          retention-days: 7
